<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prime Homes</title>
 <link rel="stylesheet" href="./styles.css">
</head>

<body>

<header>
  <header class="navbar">
    <h1 class="logo">PrimeHomes</h1>
    <nav>
      <a href="#">Home</a>
      <a href="#"Properties">properties</a>
      <a href="#"Contact">contact</a>
    </nav>
</header>

<section class="hero">
  <div class="overlay">
  <h2>Find Your Dream Home</h2>
  <p>Luxury homes made simple</p>
  </div>
</section>

<section class="search">
  <input type="text" id="search" placeholder="Search location..." onkeyup="searchProperty()">
</section>
<div class="main-section">
  <div class="properties" id="properties">
  <div class="property-card"data-location="lagos">
    <img src="images/house1.jpg" alt="house">
    <h3>Lagos Apartment</h3>
    <p>₦25,000,000</p>
    <button onclick="bookProperty('Lagos Apartment')">Book</button>
  </div>

  <div class="property-card" data-location="abuja">
    <img src="images/house2.jpg" alt="house">
    <h3>Abuja Duplex</h3>
    <p>₦45,000,000</p>
    <button onclick="bookProperty('Abuja Duplex')">Book</button>
  </div>

  <div class="property-card" data-location="ph">
    <img src="images/house3.jpg" alt="house">
    <h3>Port Harcourt Villa</h3>
    <p>₦60,000,000</p>
    <button onclick="bookProperty('PH Villa')">Book</button>
  </div>

  
<div class="contact" id="contact">
  <h2>Contact Agent</h2>
  <form>
    <input type="text" placeholder="Adewale Rayan" required>
    <input type="email" placeholder="oshoadewale36@gmail.com" required>
    <textarea placeholder="Message"></textarea>
    <button>Send</button>
  </form
<footer>
  <p>© 2026 PrimeHomes. All rights reserved</p>
</footer>

</body>
</html>
